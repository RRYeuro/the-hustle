<style id="skin67">
.q67r{align-items:center;flex-wrap:nowrap!important;gap:4px}
.q67r .btn{min-width:34px;padding:6px 8px}
.q67n{min-width:62px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.q67n.on{color:#30d158}
.row.q67sel{outline:2px solid #0a84ff;outline-offset:-2px;border-radius:8px}
.q67f{margin:8px 0 2px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.06);font-size:13px;line-height:1.45}
.q67f .bad{color:#ff453a}
</style>
<script id="skin67js">
/* skin67: multi-buy. Text-order screen: amount stepper per product, running total, one Buy all = one deal */
(function(){
const $q=id=>document.getElementById(id);
window.l67cart=function(bi,goods,priceOf,maxOf,here){
  const cart={},mxs={};goods.forEach(g=>{cart[g.id]=0;mxs[g.id]=maxOf(g)});
  const tot=g=>{const n=cart[g.id];return n?Math.round(priceOf(g)*n*bulk(n,g)):0};
  const sizes=g=>{const m=mxs[g.id];const L=[...new Set(g.sizes.map(z=>z[0]).filter(v=>v<=m))];if(m>=g.step&&!L.includes(m))L.push(m);return L.sort((a,b)=>a-b)};
  const step=(g,d)=>{const L=sizes(g),c=cart[g.id];if(d==='max')cart[g.id]=mxs[g.id];else if(d>0){const nx=L.find(v=>v>c);if(nx!=null)cart[g.id]=nx}else{const pv=[...L].reverse().find(v=>v<c);cart[g.id]=pv!=null?pv:0}draw()};
  const draw=()=>{let T=0,sp=0,bad='';goods.forEach(g=>{const n=cart[g.id],e=$q('q67_'+g.id);if(e){e.textContent=n?amt(n,g):'0';e.classList.toggle('on',n>0)}T+=tot(g);sp+=n*g.sp;if(n>mxs[g.id])bad=bad||`Too much ${g.name}.`});
    const room=S.cap-used();if(T>S.cash)bad=`Need ${money(T)}, you got ${money(S.cash)}.`;else if(sp>room+1e-9)bad=`Not enough stash space (${Math.floor(room)} left).`;
    const any=goods.some(g=>cart[g.id]>0),f=$q('q67f');
    if(f)f.innerHTML=any?`Total <b>${money(T)}</b> · cash after ${money(Math.max(0,S.cash-T))}${bad?`<div class="bad">${bad}</div>`:''}`:'Pick amounts, then Buy all.';
    const b=$q('q67buy');if(b)b.disabled=!any||!!bad};
  const card=$q('mcard');if(!card)return;
  card.querySelectorAll('[data-q67]').forEach(b=>b.onclick=()=>{const g=goods.find(x=>x.id===b.dataset.q67);if(g)step(g,b.dataset.d==='max'?'max':+b.dataset.d)});
  const buy=()=>{const pick=goods.filter(g=>cart[g.id]>0);if(!pick.length)return;let T=0;pick.forEach(g=>T+=tot(g));if(T>S.cash)return;
    const got=[],kept=[];
    pick.forEach(g=>{const n=cart[g.id],t=tot(g);S.at=bi;const of=S.offer[bi][g.id];S.at=here;
      if(of.fake){kept.push(g.name);return}
      of.stock=Math.max(0,(of.stock??0)-n);const realHave=S.inv[g.id]-S.fake[g.id];
      S.q[g.id]=Math.round((S.q[g.id]*realHave+of.real*n)/(realHave+n));S.paid[g.id]=Math.round((S.paid[g.id]*S.inv[g.id]+t)/(S.inv[g.id]+n));S.inv[g.id]+=n;S.cash-=t;try{l66rec(g,n)}catch(e){}
      {S.lb=S.lb||{};const k=bi+':'+g.id,u=t/n,o0=S.lb[k];S.lb[k]={d:S.day,u:o0&&S.day-o0.d<=4?Math.min(o0.u,u):u}}
      got.push(`${amt(n,g)} ${g.name} (${money(t)})`)});
    if(got.length){S.dropDay=S.day;const pt=ptxo();pt.n[bi]=(pt.n[bi]||0)+1;S.heat=Math.min(100,S.heat+1);
      say(`${plugName(bi)} dropped off ${got.join(', ')}.`)}
    if(kept.length)S.trust[bi]=Math.min(100,S.trust[bi]+1);
    $q('modal').hidden=true;render();
    modal(`${avatar(bi,48)}<h2>${got.length?'Order dropped off':'No deal'}</h2>${got.length?`<p>${got.map(x=>'• '+x).join('<br>')}</p>`:''}${kept.length?`<p>"Don't take the ${kept.join(' or ')}. It ain't right. I'll hit you when the good stuff land."</p>`:''}<div class="btns"><button class="btn go" id="ok67">Bet</button></div>`);
    $q('ok67').onclick=()=>{$q('modal').hidden=true;render()}};
  const bb=$q('q67buy');if(bb)bb.onclick=buy;
  /* keyboard */
  let sel=0;const rows=()=>[...card.querySelectorAll('.q67r')].map(r=>r.closest('.row')).filter(Boolean);
  const mark=()=>{const R=rows();R.forEach((r,i)=>r.classList.toggle('q67sel',i===sel))};
  if(window._k67)document.removeEventListener('keydown',window._k67,true);
  window._k67=e=>{if($q('modal').hidden||!card.contains($q('q67buy'))){document.removeEventListener('keydown',window._k67,true);window._k67=null;return}
    const R=rows();if(!R.length)return;const g=goods.find(x=>x.id===R[sel].querySelector('.q67r').dataset.g);
    if(e.key==='ArrowDown'){sel=(sel+1)%R.length;mark()}else if(e.key==='ArrowUp'){sel=(sel-1+R.length)%R.length;mark()}
    else if(e.key==='ArrowRight'&&g&&mxs[g.id]>=g.step)step(g,1);else if(e.key==='ArrowLeft'&&g)step(g,-1);
    else if(e.key==='Enter'){if(!bb.disabled)buy()}else return;e.preventDefault();e.stopPropagation()};
  document.addEventListener('keydown',window._k67,true);mark();draw()};
try{TUT.push(['Multi-buy','When you text a plug for a drop, set an amount for each product with − / + (or Max), check the total, then hit Buy all. The whole order is one deal and one trip. Keys: ↑↓ pick a product, ←→ change the amount, Enter buys.'])}catch(e){}
})();
</script>
