<script id="skin65js">

 if(inc.length)h+=`<div class="bub ord"><b>On the way</b><br>${inc.map(x=>amt(x.n,G(x.g))+' '+G(x.g).name+' · lands '+(x.day-S.day<=0?'today':dayTxt(x.day))).join('<br>')}</div>`;
 h+=`<div class="bub">${ready?greet(C):'I am out and about. Hit me back tomorrow.'}</div>`;
 h+=`<div class="mth-kb"><div class="mth-kt">Reply</div>${ready?`<button class="mth-opt" data-a="conn" data-i="${i}">Let me put in an order</button>`:`<button class="mth-opt" disabled>Hit back tomorrow</button>`}<button class="mth-opt" data-a="condrop" data-i="${i}">Lose this number</button></div>`;
 return h};
try{const _co=window.connectOrder;if(_co)connectOrder=function(i){const r=_co.apply(this,arguments);try{const mc=el('mcard'),h2=mc&&mc.querySelector('h2');if(!h2||!/^Text /.test(h2.textContent)||mc.querySelector('.cht65'))return r;
  const C=conList()[i||0];if(!C)return r;const p=h2.nextElementSibling,st=p&&p.classList.contains('s')?p.innerHTML:'';
  h2.outerHTML=`<div class="c65h">${typeof cpic==='function'?cpic(C.name,36):''}<div><b>${C.name}</b><small>Text message</small></div></div>`;

})();
