<script id="skin77js">

(function(){if(window._sk77)return;window._sk77=1;
const el=id=>document.getElementById(id),R=(a,b)=>Math.round(a+Math.random()*(b-a));
const age=()=>{try{return gAge()||S.age||18}catch(e){return S.age||18}};

function unc(){S.unc77=S.unc77||{t:0,n:0};return S.unc77}
window.l77unc=function(pay){const U=unc(),cut=Math.min(.65,.45+U.t*.02),got=Math.round(pay*cut);S.cash+=got;U.t++;U.n++;let x='';
 if(Math.random()<.08){S.heat=Math.min(100,S.heat+6);x=' A cop rolled past while you were pulling in. Heat +6.'}
 try{phoneMsg('Unc',pick([`Got it on the lift. Here go ${money(got)}, nephew.`,`Stripped. ${money(got)}. Don't bring me nothing hot in daylight.`,`That's ${money(got)}. Keep em coming, I'll take care of you.`]))}catch(e){}
 lickDone("Unc's tire shop",`You drove it to Unc's. He strips it and keeps his cut. You got ${money(got)} dirty (${Math.round(cut*100)}%). Every car you bring raises his trust and your cut. Own a chop shop ($8,000) and you keep all of it.${x}`,true)};

 const F=(S.known||[]).filter(fam);if(F.length&&S.heat>=50&&Math.random()<.3){const bi=F[Math.floor(Math.random()*F.length)];S.heat=Math.max(0,S.heat-4);try{phoneMsg(plugName(bi),'Heads up. Task force been asking about you by the store. Sit down a couple days.')}catch(e){}}}catch(e){}}

function pr(){S.p3=S.p3||{has:0,sw:0,d:-9};return S.p3}

 p.insertAdjacentHTML('beforeend',h);const b=p.querySelector('[data-p377b]');if(b)b.onclick=ev=>{ev.stopPropagation();if(S.cash<1200||age()<18)return;S.cash-=1200;S.clean=Math.min(S.clean||0,S.cash);pr().has=1;say('Bought a 3D printer. It\'s set up at your place. Print switches on your home block.');el('modal').hidden=true;render()}}}}catch(e){console.error('sk77 pawn',e)}return r}}catch(e){}
function prHTML(){try{if(S.meet)return '';const P=pr();if(!P.has)return '';const home=(()=>{try{return homeBlock()===S.at}catch(e){return true}})();
 return `<div class="row" data-pr77="1" style="flex-wrap:wrap"><div class="info" style="flex:1 1 180px"><div class="t">🖨️ Switches: ${P.sw}</div><div class="s">${home?'Print 2 to 4 at home (10 energy, once a day).':'Your printer is at home.'} Sell for about $200 each, dirty. Heat on every sale and some buyers are cops.</div></div>
  <div class="btns">${home?`<button class="btn" data-pr77b="p" ${P.d===S.day?'disabled':''}>${P.d===S.day?'Printed today':'Print'}</button>`:''}<button class="btn go" data-pr77b="s" ${P.sw?'':'disabled'}>Sell ${P.sw||''}</button></div></div>`}catch(e){return ''}}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-pr77b]');if(!b||b.disabled)return;e.preventDefault();e.stopPropagation();const P=pr();
 if(b.dataset.pr77b==='p'){if(P.d===S.day)return;if(typeof spendEn==='function'&&spendEn(10)===false)return;P.d=S.day;let n=R(2,4);if(Math.random()<.15){n=Math.max(0,n-2);say('The filament jammed. Only printed '+n+'.')}P.sw+=n;if(n)say(`Printed ${n} switch${n>1?'es':''}. You got ${P.sw}.`)}

  const got=n*R(150,250);P.sw=0;S.cash+=got;S.heat=Math.min(100,S.heat+2*n);say(`Sold ${n} switch${n>1?'es':''} for ${money(got)} dirty. Heat +${2*n}.`)}
 render()},true);
/* hooks */
try{const _nd=nextDay;nextDay=function(){const r=_nd.apply(this,arguments);try{famDay()}catch(e){}return r}}catch(e){}

 d.querySelectorAll('[data-d77]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();el('modal').hidden=true;const k=b.dataset.d77;if(k==='f')(S.known||[]).forEach(i=>S.trust[i]=Math.max(S.trust[i]||0,90));if(k==='u'){S.att=S.att||[0,0,0,0,0,0];S.att[S.at]=40;S.uc77=null}if(k==='p'){pr().has=1;pr().sw+=5}if(k==='c')unc().t+=5;render()})}}catch(e){}return r}}catch(e){}
try{TUT.push(["Unc's, family plugs, undercover Js, 3D printer","No chop shop? Stolen cars go to Unc's tire shop. He strips them and keeps a cut (55% at first, down to 35% as he trusts you). Own a chop shop and you keep it all. Plugs at 90 trust are family: 5% off and they warn you when the task force asks about you. On a block with attention 30+, watch for a J with a tell (new shoes, too many questions) and tap Don't serve him. 3D printer (18+, pawn shop, $1,200): print switches at home once a day, sell them on any block. Heat on every sale, some buyers are feds."])}catch(e){}
})();</script>
