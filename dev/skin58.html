<script id="skin58js">
(function(){if(window._sk58)return;window._sk58=1;
const el=id=>document.getElementById(id);
/* moving asks first: pick how you get there, so a mis-tap does not cost the day */
function opts(bi){const o=[],age=S.age||18,teenFree=S.cal&&age<18&&S.freeMv!==S.day,car=S.car&&age>=16&&(S.en==null||S.en>=3),pass=S.bus>=S.day;
 if(car)o.push(['go',`🚗 Drive · $5 gas, 3 energy`,S.car==='stolen'?'Stolen car: +3 heat':'No day lost','go']);

 if(!car)o.push(['go',teenFree?'🚶 Walk · free move':'🚶 Walk · takes the day',teenFree?'First move of a school day is free':'The day ends when you get there','']);
 return o}

 el('no58').onclick=()=>{close();render()};
 document.querySelectorAll('#mcard [data-g58]').forEach(b=>b.onclick=()=>{const x=O[+b.dataset.g58];close();window._go58=1;try{act(x[0],{dataset:{i:String(bi)}})}catch(e){console.error('sk58',e)}window._go58=0;render();if(S.at===bi&&after&&el('modal').hidden)after()})};
