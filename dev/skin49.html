<script id="skin49js">
(function(){if(window._sk49)return;window._sk49=1;
const el=id=>document.getElementById(id),rk=()=>window.l48rk?l48rk():(S.rk||0);
const maxR=()=>[0,1,2,3,4,5][Math.min(5,rk())];
/* runners are recruited, never handed out */
function mig(){try{const B=b5();if(S.dl49)return;S.dl49=1;if(B.dl&&B.dl.length===3&&B.dl.map(d=>d.n).join()==='Dre,Moe,Tasha'&&!B.dl.some(d=>d.fr)){B.dl=[];B.ord=[]}}catch(e){}}
w5bDealers=function(){const B=b5();mig();if(!B.dl)B.dl=[];if(rk()<1){if(B.ord&&B.ord.length)B.ord=[];return []}return B.dl};
function canPut(f){const B=b5();return rk()>=1&&adult()&&(B.dl||[]).length<maxR()&&(f.close||0)>=40&&!(B.dl||[]).some(d=>d.n===f.name)}
function putOn(i){const f=(S.friends||[])[i];if(!f||!canPut(f))return;const B=b5();B.dl=B.dl||[];B.dl.push({n:f.name,loy:Math.round(f.close),fr:1});
 try{phoneMsg(f.name,f.trait==='snake'?'Say less. I got you. 👀':pk(['Bet. I got you. Send me what you want moved.','Finally. Put me on, I\'ll move it.','Say less. I\'ll push it for you.']))}catch(e){}say(`You put ${f.name} on. ${f.trait==='snake'?'Keep an eye on that one.':'Orders start next week.'}`);render()}
function cutOff(n){const B=b5(),old=B.dl||[];B.ord=(B.ord||[]).filter(o=>(old[o.d]||{}).n&&old[o.d].n!==n).map(o=>({...o,nm:old[o.d].n}));B.dl=old.filter(d=>d.n!==n);B.ord.forEach(o=>{o.d=B.dl.findIndex(d=>d.n===o.nm);delete o.nm});const f=(S.friends||[]).find(x=>x.name===n);if(f)f.close=Math.max(0,f.close-10);say(`You cut ${n} off from pushing for you.`);render()}
const pk=a=>a[Math.floor(Math.random()*a.length)];
function runnersHTML(){if(rk()<1||!adult())return '';const B=b5(),dl=B.dl||[],fr=(S.friends||[]).map((f,i)=>[f,i]).filter(([f])=>!dl.some(d=>d.n===f.name));
 let h=`<div class="sec">Your runners (${dl.length}/${maxR()})</div>`;
 if(!dl.length)h+=`<div class="row"><div class="info"><div class="s">Nobody pushes for you yet. Put a friend on: they need to be close to you (40+). Meet people at school, the court, the barbershop.</div></div></div>`;
 dl.forEach(d=>{h+=`<div class="row"><div class="info"><div class="t">${esc(d.n)}</div><div class="s">Loyalty ${Math.round(d.loy)}. Low loyalty runners skim and can snitch.</div></div><button class="btn" data-a49="cut" data-n="${esc(d.n)}">Cut off</button></div>`});
 fr.slice(0,6).forEach(([f,i])=>{const ok=canPut(f);h+=`<div class="row"><div class="info"><div class="t">${esc(f.name)}</div><div class="s">Close ${Math.round(f.close||0)}/100${(f.close||0)<40?' · need 40':''}${f.sch?' · from school':''}</div></div><button class="btn ${ok?'go':''}" data-a49="put" data-i="${i}" ${ok?'':'disabled'}>Put on</button></div>`});
 if(dl.length>=maxR()&&maxR()<5)h+=`<div class="row"><div class="info"><div class="s">🔒 More runners at ${rname(rk()+1)} (level ${RANKS[rk()+1][0]}).</div></div></div>`;
 return h}
try{const _wo=w5bOrders;w5bOrders=function(){let h=_wo.apply(this,arguments);try{h=runnersHTML()+h}catch(e){console.error('sk49 ro',e)}return h}}catch(e){}
/* school: meet people at lunch */
try{const _ps=paneSchool;paneSchool=function(){let h=_ps.apply(this,arguments);try{const inS=S.school==='in'||S.college==='in';if(inS){const went=S.classDay===S.day,done=S.lunch49===S.day;h+=`<div class="row" style="flex-wrap:wrap"><div class="info" style="flex:1 1 200px;min-width:0"><div class="t">🍔 Lunch</div><div class="s">${went?'Sit somewhere new and meet people. Classmates can become friends, and friends can push for you later.':'Go to class first.'}</div></div><button class="btn go" data-a49="lunch" ${went&&!done?'':'disabled'}>${done?'Ate today':'Sit with new people'}</button></div>`}}catch(e){console.error('sk49 sch',e)}return h}}catch(e){}
function lunch(){if(S.lunch49===S.day||S.classDay!==S.day)return;S.lunch49=S.day;
 if((S.friends||[]).length>=8||Math.random()<.3){say('Nobody new today. You ate with the usual people.');return render()}
 window._mf49w=S.college==='in'?'in the student center':'at lunch';meetFriend(true);
 const y=el('y');if(y){const o=y.onclick;y.onclick=()=>{o&&o();try{const f=S.friends[S.friends.length-1];if(f){f.sch=1;f.close=Math.max(f.close||0,30)}}catch(e){}}}}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a49]');if(!b||b.disabled)return;e.preventDefault();e.stopPropagation();const k=b.dataset.a49;
 if(k==='put')putOn(+b.dataset.i);if(k==='cut')cutOff(b.dataset.n);if(k==='lunch')lunch()},true);
/* tutorial + dev */
try{TUT.push(['Runners','Nobody pushes for you until you put them on. Reach Petty Dealer, get a friend to 40+ close, then hit Put on in the Phone (Dealer orders). One runner at Petty Dealer, one more each rank. Meet people at lunch after class, at the court, the barbershop.'])}catch(e){}
try{const _dp=devPanel;devPanel=function(){const r=_dp.apply(this,arguments);try{const mc=el('mcard');if(mc&&!el('modal').hidden&&!mc.querySelector('[data-d49]')){const d=document.createElement('div');d.innerHTML=`<div class="sec">Runners (new)</div><div class="btns"><button class="btn" data-d49="f">Add a close friend</button><button class="btn" data-d49="p">Put a friend on now</button></div>`;const h2=mc.querySelector('h2');if(h2&&h2.parentNode)h2.parentNode.insertBefore(d,h2.nextSibling);else mc.appendChild(d);
 d.querySelectorAll('[data-d49]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();el('modal').hidden=true;S.friends=S.friends||[];if(b.dataset.d49==='f')S.friends.push({name:pk(['Kash','Bean','Lil Mo','Trey','Nae']),trait:'loyal',role:'none',close:60});else{if(S.lvl<3){S.lvl=3;addXP(1)}if(!S.friends.length)S.friends.push({name:'Kash',trait:'loyal',role:'none',close:60});S.friends[0].close=Math.max(60,S.friends[0].close);putOn(0)}render()})}}catch(e){console.error('sk49 dev',e)}return r}}catch(e){}
})();</script>
