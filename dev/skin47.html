<script id="skin47js">
(function(){if(window._sk47)return;window._sk47=1;
const el=id=>document.getElementById(id);
/* long cards: picture becomes a thin strip */
try{const _wc=wCard;wCard=function(art,title,text,opts){const r=_wc.apply(this,arguments);try{const mc=el('mcard');if(mc){const long=(opts&&opts.length>=4)||String(text||'').replace(/<[^>]+>/g,'').length>320||/vb45/.test(text||'');mc.classList.toggle('long47',!!long)}}catch(e){}return r};
