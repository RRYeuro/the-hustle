  const other=()=>{for(let i=0;i<BLOCKS.length;i++)if(i!==S.at&&!gone(i)){if(!S.known.includes(i))S.known.push(i);S.trust[i]=Math.max(tr(i),60);pk(i).pu=-9;return i}return -1};
  el('modal').hidden=true;
  if(k==='end'){endMeet();return render()}
  if(k==='spots'){try{tab='move'}catch(e){}return render()}
  if(k==='t25'||k==='t65'){all(k==='t25'?25:65);say('Dev: every plug at '+(k==='t25'?25:65)+' trust.');try{tab='move'}catch(e){}return render()}
  if(k==='meet'){if(gone(S.at)){say('Dev: no plug on this block right now.');return render()}if(!S.known.includes(S.at))S.known.push(S.at);S.trust[S.at]=Math.max(tr(S.at),60);return meet(S.at)}
  if(k==='intro'){const x=(S.known||[]).find(i=>i!==S.at&&!gone(i));if(x==null)return render();S.known=S.known.filter(i=>i!==x);S.introD=-9;pk(x).cold=0;S.cash=Math.max(S.cash,2000);try{tab='move'}catch(e){}render();return intro(x)}
  if(k==='call'){const bi=other();if(bi<0)return render();S.heat=Math.min(S.heat,40);return plugCall(bi,true)}})}}catch(e){console.error('sk31 dev',e)}return r}}catch(e){}
})();
