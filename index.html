<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="The Hustle"><meta name="theme-color" content="#141118"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%;touch-action:manipulation}</style></head><body>
<title>The Hustle: No Days Off</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap">
<style>
/* Layout: one-screen phone app — stat strip, tabbed panel, event log; single dark "streetlight" look */
:root{
  --bg:#121014; --panel:#1c191f; --line:#2f2a33; --fg:#efe9e1; --dim:#9a9198;
  --accent:#f5b72a; --money:#5fd38a; --blood:#e8504a; --heat:#4aa3ff;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;
  --label:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
.app{max-width:560px;margin:0 auto;padding-block:12px 24px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
h1 span{white-space:nowrap}
h1{font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.02em;margin:0;line-height:1;
  color:var(--accent);text-shadow:0 0 18px rgba(245,183,42,.25)}
.day{font-family:var(--label);font-size:16px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.day b{color:var(--fg);font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.stat .k{font-family:var(--label);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.stat .v{font-family:var(--label);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%}
.where{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.where .n{font-family:var(--display);font-size:22px;letter-spacing:.02em}
.where .o{font-family:var(--label);font-size:14px;color:var(--dim);text-align:right}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.tabs button{font-family:var(--label);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em;
  background:transparent;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:9px 0;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:#1a1408;border-color:var(--accent)}
.pane{display:flex;flex-direction:column;gap:8px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.row .info{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--dim)}
.price{font-family:var(--label);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.up{color:var(--blood)} .down{color:var(--money)}
.btn{font-family:var(--label);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.05em;
  background:#2a252e;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.go{background:var(--accent);color:#1a1408;border-color:var(--accent)}
.btn.red{background:var(--blood);color:#fff;border-color:var(--blood)}
.btn.green{background:var(--money);color:#0b1a10;border-color:var(--money)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:focus-visible,.tabs button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--label);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim)}
.chip.mine{color:var(--money);border-color:var(--money)}
.chip.war{color:var(--blood);border-color:var(--blood)}
.chip.here{color:var(--accent);border-color:var(--accent)}
.sec{font-family:var(--label);font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:4px 2px 0}
.log{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;max-height:180px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:4px}
.log p{margin:0;color:var(--dim)} .log p:first-child{color:var(--fg)}
.log .d{font-family:var(--label);color:var(--accent);margin-right:6px}
.modal{position:fixed;inset:0;background:rgba(5,4,6,.82);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.card{max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.02em;text-wrap:balance}
.card p{margin:0;line-height:1.45}
.qty{display:flex;align-items:center;gap:8px}
.qty input{width:100%;accent-color:var(--accent)}
.qty output{font-family:var(--label);font-weight:700;font-size:22px;min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.card{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.6}}}
.side,.main{display:contents}
.late{order:2}
@media (min-width:900px){
  .app{max-width:1180px;display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);column-gap:22px;row-gap:12px;align-items:start}
  header{grid-column:1/-1}
  .side,.main{display:flex;flex-direction:column;gap:12px;min-width:0}
  .side{position:sticky;top:12px}
  .late{order:0}
  .log{max-height:340px}
}
</style>

<div class="app">
  <header>
    <h1>THE HUSTLE <span style="font-family:var(--label);font-size:15px;letter-spacing:.14em;color:var(--dim);text-shadow:none;vertical-align:middle">NO DAYS OFF</span></h1>
    <div class="day"><span id="who"></span> · <span id="rk" style="color:var(--accent)"></span> · Day <b id="day">1</b><span id="dmax"> / 30</span></div>
  </header>
  <div class="side">
  <div class="row" id="me" style="padding:8px 10px"></div>
  <div class="stats">
    <div class="stat"><div class="k">Cash</div><div class="v" id="cash" style="color:var(--money)"></div></div>
    <div class="stat"><div class="k">Stress</div><div class="v" id="stress"></div><div class="bar"><i id="stressb" style="background:var(--blood)"></i></div></div>
    <div class="stat"><div class="k">Stash</div><div class="v" id="stash"></div></div>
    <div class="stat"><div class="k">Health</div><div class="v" id="hp"></div><div class="bar"><i id="hpb" style="background:var(--money)"></i></div></div>
    <div class="stat"><div class="k">Heat</div><div class="v" id="heat"></div><div class="bar"><i id="heatb" style="background:var(--heat)"></i></div></div>
    <div class="stat"><div class="k">Rep</div><div class="v" id="rep" style="color:var(--accent)"></div></div>
  </div>
  <div class="where"><div><div class="sec" style="margin:0">You're on</div><div class="n" id="here"></div></div><div class="o" id="owner"></div></div>
  <div class="row" id="mission" style="border-color:var(--accent)"></div>
  <div class="sec late">What's happening</div>
  <div class="log late" id="log"></div>
  <div class="btns late"><button class="btn" id="newgame">Menu</button><button class="btn" id="devbtn" style="border-color:var(--heat);color:var(--heat)">Dev</button><button class="btn go" id="retire" hidden>Retire and see your score</button></div>
  </div>
  <div class="main">
  <div class="tabs" role="tablist">
    <button role="tab" data-t="rap" aria-selected="false" id="rtab" hidden>Studio</button>
    <button role="tab" data-t="rob" aria-selected="false" id="htab" hidden>Heists</button>
    <button role="tab" data-t="block" aria-selected="true">Block</button>
    <button role="tab" data-t="move" aria-selected="false">Move</button>
    <button role="tab" data-t="beef" aria-selected="false">Beef</button>
    <button role="tab" data-t="crew" aria-selected="false">Me</button>
    <button role="tab" data-t="phone" aria-selected="false" id="phtab">Phone</button>
    <button role="tab" data-t="cards" aria-selected="false" id="cardtab">Cards</button>
  </div>
  <div class="btns" id="fx"></div>
  <div class="pane" id="pane"></div>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="card" id="mcard"></div></div>

const CHARS=[
 {id:'slick',name:'Slick',role:'The Talker',cash:3000,story:'Jalen "Slick" Moore. Started rapping about stealing cars, and the songs were not made up. He could get into anything on four wheels and talk his way out of any stop, until the one he could not. Did three years, came home with a rap name and a plug list, and now he talks his way into every deal.',perk:'Knows 2 plugs from the jump and they trust him. +20% odds when talking price.'},
 {id:'tank',name:'Tank',role:'The Fallen Star',cash:2000,story:'Darius "Tank" Coleman. Star running back on a full ride, scouts at every game, headed to the league. Tore his knee up in the championship game and it was over. Tried the 9-to-5, got let go, and missed the love he used to get on Friday nights. The streets still know his name, so he started trapping.',perk:'Knows 1 plug. People still know his name: starts with 15 rep, +10 strength and a soldier. Bad knee: worse at running away.'},
 {id:'shade',name:'Shade',role:'The Ghost',cash:2500,story:'Andre "Shade" Wallace. His songs are all over the city, but nobody has seen his face. No interviews, no pictures, no shows. People argue about who he really is. That mystery is the reason nobody can pin anything on him.',perk:'Always watching: knows 3 plugs and can spot fakes. Heat builds half as fast. Gets away from cops way more.'},
 {id:'val',name:'Val',role:'The Boss Lady',cash:2500,story:'Valentina "Val" Reyes. Ran the register at her family\'s taqueria since she was twelve and learned the back door moves more money than the front. When her dad got sick, she took over everything.',perk:'Knows 2 plugs. Runs it like a business: the Js pay her 10% more and her workers never steal.'},
 {id:'country',name:'Casper',role:'Raised by the Block',cash:2000,story:'Cody "Casper" Walsh. Only white boy on Eastside growing up. His mom worked doubles, so the block raised him: the corner store fed him, the older homies taught him. Everybody knows Casper, and he ain\'t going nowhere.',perk:'Knows 1 plug. The block raised him: every crew starts out respecting him, and staying cool with cops is easier.'},

function placeAct(k,id){const back=()=>{render();openPlace(id)};

function tone(f,d,type='sine',v=.08,when=0,slide){const a=ac();if(!a)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function sfx(k){if(!SND.sfx)return;try{

}catch(e){}}
let musT=null,musStep=0;
function musicStart(){const a=ac();if(!a||musT)return;const bpm=84,st=60/bpm/2;const bass=[55,55,65.4,49];
  musT=setInterval(()=>{if(!SND.music)return;const b=musStep%16;
    if(b%8===0)tone(110,.25,'sine',.18,0,40);
    if(b%8===4)tone(180,.1,'triangle',.06,0,120);
    if(b%2===1)tone(6000,.03,'square',.008);
    if(b%4===0)tone(bass[Math.floor(musStep/16)%4],st*3.5,'sawtooth',.03);
    if(b===0)[0,1].forEach(j=>tone([392,349,330,294][Math.floor(musStep/16)%4]*(j?1.5:1),st*7,'sine',.02));
    musStep++},st*1000)}

  S.heat=Math.max(0,S.heat-3);
  S.crews.forEach(c=>{if(c.alive){c.str+=rnd(0,1);if(c.beef>0&&c.beef<45)c.beef=Math.max(0,c.beef-2);c.envy=Math.max(0,c.envy-2);if(c.beef>=45)c.respect=Math.max(0,c.respect-2)}});
  roll();
  if(S.day>maxDay()&&!freeMode()){S.over=true;return}
  drawCard(.09,'Out on the block,');

    say(pick([`Somebody at the gas station put you on with ${plugName(bi)} from ${BLOCKS[bi]}.`,`Your cousin linked you with ${plugName(bi)} on ${BLOCKS[bi]}.`,`Met ${plugName(bi)} from ${BLOCKS[bi]} at a party. He got you now.`,`A customer vouched for you. ${plugName(bi)} on ${BLOCKS[bi]} knows you now.`]))}

function event(){

  if(angry&&Math.random()<angry.beef/130*(rankAt(5)?.5:1)*D().risk)return ambush(angry);
  if(S.cash>600&&Math.random()<.035*D().risk*(S.cash>5000?1.6:1))return jackboys();
  if(Math.random()<S.heat/160*D().risk*((S.friends||[]).some(f=>f.close>=80)?.85:1)*(S.job?.8:1)*(S.school==='in'?.8:1))return cops();
  const en=Object.keys(S.enemies||{}).map(Number).find(bi=>S.burned[bi]);if(en!==undefined&&Math.random()<.15)return enemyHit(en);
  const jel=S.crews.find(c=>c.alive&&c.envy>=70&&!c.ally&&S.gang!==c.id);if(jel&&Math.random()<.3)return jealous(jel);
  if(S.heat>=40&&Math.random()<HOMES[S.home].raid*(1.4-(S.comm??30)/80)*S.heat/100)return raid();
  if(S.home==='couch'&&!S.cousinDeal&&!S.cousinNo&&(S.cash>2000||used()>15)&&Math.random()<.15)return cousinAsk();
  if(Math.random()<({sec8:.3,low:.22,couch:.18,family:.12,apt:.14,condo:.09,house:.06,gfplace:.12,granny:.1})[S.home])return neighborAsk();
  if((S.friends||[]).length<5&&Math.random()<.05)return meetFriend(false);
  const fe=friendEvent();if(fe)return;
  if(gangEvent())return;
  if(bizEvent())return;
  if(!S.connect&&Math.random()<rnd(3,9)/100){const ce=connectCand();if(ce!==undefined)return connectMeet(ce)}
  if(adult()&&Math.random()<.06)return linkup(false);
  if(adult()&&S.gf&&S.gf.rel>=80&&(S.age||25)>=19&&(S.kids||[]).length<3&&Math.random()<.02)return baby();
  if(S.day>=2&&!S.rapOn&&!S.rapNo&&Math.random()<.07)return lifeOffer('rap',false);
  if(S.day>=2&&!S.robOn&&!S.robNo&&Math.random()<.07)return lifeOffer('rob',false);
  const r=Math.random();
  if(r<.08){const g=pick(GOODS);const n=pick(g.sizes.slice(0,2))[0];if(used()+n*g.sp<=S.cap){S.inv[g.id]+=n;say(`Found ${amt(n,g)} of ${g.name} somebody left behind.`)}}
  else if(r<.13){const g=pick(GOODS);S.prices[S.at][g.id]=Math.round(g.hi*rnd(25,40)/10);say(`Nobody got ${g.name} on ${BLOCKS[S.at]}. Prices went crazy.`)}
}
