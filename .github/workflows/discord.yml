name: Discord update ping
on:
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:
    inputs:
      msg:
        description: Patch notes text
        required: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Post to Discord
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ROLE: ${{ secrets.DISCORD_ROLE_ID }}
          MSG: ${{ github.event.head_commit.message || github.event.inputs.msg }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          [ -z "$HOOK" ] && echo "No DISCORD_WEBHOOK secret set, skipping" && exit 0
          case "$MSG" in *"[silent]"*) echo "Silent bump, no ping"; exit 0;; esac
          python3 - <<'PY'
          import json, os, re, urllib.request
          import subprocess
          def b(txt):
              m = re.search(r"const BUILD='(v\d+)'", txt)
              return m.group(1) if m else None
          build = b(open('index.html').read())
          try:
              prev = b(subprocess.run(['git', 'show', 'HEAD~1:index.html'], capture_output=True, text=True).stdout)
          except Exception:
              prev = None
          if build and build == prev and os.environ.get('MANUAL') != 'true':
              print('Build number unchanged, no ping')
              raise SystemExit(0)
          build = build or 'new build'
          lines = [l.rstrip() for l in (os.environ.get('MSG') or '').split('\n') if l.strip() and not l.startswith(('Co-Authored-By','Claude-Session'))]
          head = lines[0].strip() if lines else ''
          if head.lower() == 'game update': head = ''
          line = '\n'.join(([('**' + re.sub(r'^v\d+:\s*', '', head) + '**')] if head else []) + lines[1:])[:3800]
          role = os.environ.get('ROLE', '').strip()
          body = {
            'content': f'<@&{role}>' if role else '',
            'allowed_mentions': {'roles': [role]} if role else {'parse': []},
            'embeds': [{
              'title': f'🔥 {build} JUST DROPPED 🔥',
              'description': (line + '\n\n' if line else '') + '\n⏳ Live in 10-20 min\n🔄 Restart to get it: PC Ctrl+Shift+R (Mac Cmd+Shift+R). iPhone: Safari aA > Reload Page. Home Screen app: swipe it closed and reopen (twice if still old). Check the version number.\n🎮 Run it: https://rryeuro.github.io/the-hustle/\n💬 Found a bug or a bad take? Drop it in the chat.',
              'color': 0xE74C3C}]}
          req = urllib.request.Request(os.environ['HOOK'], json.dumps(body).encode(),
                  {'Content-Type': 'application/json', 'User-Agent': 'hustle-ci'})
          urllib.request.urlopen(req)
          PY
